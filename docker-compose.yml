# Project name is pinned so container/volume names never depend on where this
# repo is checked out (the mesh puts it in 1-primary/magnate).
name: magnate

services:
  magnate:
    build: .
    container_name: magnate
    restart: unless-stopped
    # Memory posture (docs/service-audit.md): billing API is light; cap for
    # node heap safety.
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - apparmor:unconfined
    ports:
      # Host port configurable via MAGNATE_PORT (default 3000) — lets the app
      # sit beside other :3000 services on a shared host (e.g. a billing portal).
      - "${MAGNATE_PORT:-3000}:3000"
    environment:
      # All values come from .env (gitignored — keep secrets out of git!).
      # Copy .env.sample to .env and fill in the real values, or run
      # `docker compose up -d` and let Compose read them from .env.
      APP_URL: "${APP_URL:-https://app.magnate.innotel.us}"
      # Stripe (create keys at https://dashboard.stripe.com/apikeys)
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-sk_live_xxx}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-whsec_xxx}"
      STRIPE_CURRENCY: "${STRIPE_CURRENCY:-usd}"
      # Jellyfin server + API key (Dashboard → Advanced → API Keys)
      JELLYFIN_URL: "${JELLYFIN_URL:-https://media.magnate.innotel.us}"
      JELLYFIN_API_KEY: "${JELLYFIN_API_KEY:-your-jellyfin-api-key}"
      # Authentik — external by default. Set AUTHENTIK_BASE_URL and
      # AUTHENTIK_BOOTSTRAP_TOKEN for the shared IdentityOps instance, or
      # start with `--profile authentik` to run the local replacement.
      # Admin SSO through Cerulean (the auth & trust stack). When
      # AUTHENTIK_ISSUER_URL/_CLIENT_ID/_CLIENT_SECRET are set, the admin login
      # page offers "Sign in with Cerulean"; AUTHENTIK_ADMIN_EMAILS is the
      # comma-separated allowlist that may hold the admin session.
      # Account portal link (footer + success page): Authentik self-service
      # user settings (password resets). Defaults to AUTHENTIK_BASE_URL/if/user/
      ACCOUNT_PORTAL_URL: "${ACCOUNT_PORTAL_URL:-https://auth.magnate.innotel.us/if/user/}"
      # Jellyseerr request portal (movie/TV requests, tied to Jellyfin)
      REQUEST_URL: "${REQUEST_URL:-https://req.magnate.innotel.us}"
      # LEGACY placeholder — the ARR billing-api was retired; Magnate enforces
      # access itself in its Stripe webhook (app/api/webhook/route.ts).
      # Kept so existing deployments' .env values don't break `up`.
      BILLING_API_URL: "${BILLING_API_URL:-}"
      # Affiliate & referral program
      # % of a referral's first payment credited to the referrer (0 disables)
      REFERRAL_REWARD_PERCENT: "${REFERRAL_REWARD_PERCENT:-10}"
      # Optional Stripe coupon ID applied to referred signups' first invoice
      REFERRAL_COUPON_ID: "${REFERRAL_COUPON_ID:-}"
      # AI recommendations & churn prevention (OpenAI-compatible API)
      AI_API_URL: "${AI_API_URL:-https://api.openai.com/v1}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-gpt-4o-mini}"
      # Authentik (Cerulean SSO) — the admin panel's identity provider.
      # These MUST be passed through: lib/oidc.ts reads them from process.env,
      # so a value that only lives in .env (compose substitution) never reaches
      # the container and SSO silently stays off.
      AUTHENTIK_ISSUER_URL: "${AUTHENTIK_ISSUER_URL:-}"
      AUTHENTIK_CLIENT_ID: "${AUTHENTIK_CLIENT_ID:-}"
      AUTHENTIK_CLIENT_SECRET: "${AUTHENTIK_CLIENT_SECRET:-}"
      AUTHENTIK_REDIRECT_URI: "${AUTHENTIK_REDIRECT_URI:-}"
      AUTHENTIK_ADMIN_EMAILS: "${AUTHENTIK_ADMIN_EMAILS:-}"
      # Admin API (user provisioning / password resets) — same caution.
      AUTHENTIK_BASE_URL: "${AUTHENTIK_BASE_URL:-}"
      AUTHENTIK_BOOTSTRAP_TOKEN: "${AUTHENTIK_BOOTSTRAP_TOKEN:-}"
      # SecretOps (Cerulean Vault) — the entrypoint resolves vault:// refs
      # (Stripe keys) through these before boot. The path-scoped token file is
      # minted by the platform: data/vault/token/magnate.token on .46.
      VAULT_ADDR: "${VAULT_ADDR:-}"
      VAULT_TOKEN: "${VAULT_TOKEN:-}"
      VAULT_TOKEN_FILE: "${VAULT_TOKEN_FILE:-}"
      VAULT_PREFIX: "${VAULT_PREFIX:-cerulean}"
      PAID_GROUPS: "${PAID_GROUPS:-paid_users}"
      # Default paid-tier group for plans without their own override.
      # Members gain whatever the consumers grant to that group (Jellyfin
      # LDAP filters, Distro entitlements, Olympus quotas read the same claim).
      # Admin panel — identity is Cerulean Authentik. The password env is the
      # BREAK-GLASS fallback: it only works while BREAKGLASS_LOGIN is set, and
      # the login page hides the password form otherwise (lib/auth.ts).
      BREAKGLASS_LOGIN: "${BREAKGLASS_LOGIN:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-change-me-to-a-strong-password}"
      # Used to encrypt stored credentials and sign admin sessions
      SESSION_SECRET: "${SESSION_SECRET:-change-me-to-a-long-random-string}"
    networks: [magnate-net]
    volumes:
      - ./data:/app/data

  # ── Authentik — optional local identity replacement ──
  # Default deployments use the shared external Authentik instance. Enable the
  # local replacement explicitly with: docker compose --profile authentik up -d




networks:
  magnate-net:
    name: magnate-net
