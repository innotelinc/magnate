name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  publish-docker-image:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/innotelinc/magnate-subscription-platform
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
          # latest=auto (the default flavor) adds the `latest` tag for stable
          # semver tags and omits it for prereleases. The v{{version}} tag keeps
          # the v-prefixed convention the ARR stack's docker-compose.yml uses.

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Release artifact: a single-platform image tarball for offline deploys.
      # buildx pushes without keeping a local image, so build once more with
      # plain docker build and export it.
      - name: Build artifact image (amd64)
        run: docker build --platform linux/amd64 -t magnate-release .

      - name: Export and compress image tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker save magnate-release | gzip > "magnate-subscription-platform-${VERSION}.tar.gz"
          sha256sum "magnate-subscription-platform-${VERSION}.tar.gz" > SHA256SUMS
          ls -lh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magnate-release
          path: |
            magnate-subscription-platform-*.tar.gz
            SHA256SUMS

  create-release:
    name: Create GitHub Release with artifacts
    needs: publish-docker-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: magnate-release
          path: ./artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ./artifacts
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Magnate v${VERSION}" \
            --generate-notes \
            "magnate-subscription-platform-${VERSION}.tar.gz" \
            SHA256SUMS